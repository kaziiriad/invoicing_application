version: '3.8'

services:
  backend:
    build: 
      context: .
      dockerfile: Dockerfile.backend
    container_name: django_backend
    volumes:
      - static_volume:/app/backend/staticfiles
    environment:
      - DATABASE_URL=postgresql://invoicing_user:invoicing_pass@postgres:5432/invoicing_db
      - DEBUG=False
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend,nginx
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: react_frontend
    volumes:
      - frontend_volume:/app/frontend/dist
    healthcheck:
      test: ["CMD", "test", "-f", "/app/frontend/dist/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - static_volume:/app/backend/staticfiles
      - frontend_volume:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: invoicing_user
      POSTGRES_PASSWORD: invoicing_pass
      POSTGRES_DB: invoicing_db
    volumes:
      - postgres_volume:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoicing_user -d invoicing_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      



volumes:
  static_volume:
    driver: local
  frontend_volume:
    driver: local
  postgres_volume:
    driver: local