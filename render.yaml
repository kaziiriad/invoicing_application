# render.yaml
# This file automates the deployment of the InvoiceFlow application on Render.
# Create a new "Blueprint" on Render and connect your repository.
# Render will automatically detect this file and configure the services.

services:
  # 1. PostgreSQL Database
  - name: database
    type: pserv
    plan: free
    postgres:
      version: "16"

  # 2. Backend Service (Django + Gunicorn)
  - name: backend
    type: web
    plan: free
    env: python
    region: oregon # You can choose a region closer to you
    rootDir: backend
    buildCommand: "uv sync && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    healthCheckPath: /api/token/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: DATABASE_URL
        fromService:
          type: pserv
          name: database
          property: connectionString
      - key: SECRET_KEY
        generateValue: true # Let Render generate a secure secret key
      - key: WEB_CONCURRENCY
        value: 4 # Recommended by Render for Gunicorn
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: static_site
          name: frontend
          property: url
      - key: DJANGO_ALLOWED_HOSTS
        fromService: # The backend's own public URL
          type: web
          name: backend
          property: host

  # 3. Frontend Service (React Static Site)
  - name: frontend
    type: static_site
    plan: free
    region: oregon # Use the same region as the backend
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    publishDir: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: backend
          property: url