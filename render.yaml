# render.yaml
# Defines the database and frontend services for the InvoiceFlow application.
# The backend service should be deployed manually as a free Web Service.

databases:
  - name: database
    plan: free
    ipAllowList: [] # Allow connections from anywhere

services:
  # Frontend Service (React Static Site)
  - name: frontend
    type: web
    runtime: static
    region: oregon # Static sites are global, but this helps Render co-locate services.
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    # IMPORTANT: The VITE_API_URL will need to be set manually in the
    # Render dashboard after the backend service is deployed.